const reduce=matchMedia('(prefers-reduced-motion: reduce)');let paused=reduce.matches;let persona=0,scene=0,mode=0,story=0,running=false;let readerIndex=-1,runToken=0,runTimer=null,runResolver=null;const activeAnimations=new Set();const T=(zh,en)=>language==='zh'?zh:en;const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people=[{name:'Grove',image:'assets/persona.webp',trait:['温柔 · 细腻 · 熟悉','Gentle · Attentive · Familiar'],lines:[['早上好。先别着急，把今天的第一束光留给自己。','Good morning. Take a breath. Keep the first light of the day for yourself.'],['还有十五分钟出门。钥匙放在手边，慢慢准备就好。','We leave in fifteen minutes. Keep your keys nearby; there is still time.'],['记下了。这个小念头，我们晚一点再一起看看。','Saved. We can come back to this little idea together later.']]},{name:'Nova',image:'assets/avatar-nova.webp',trait:['好奇 · 明快 · 自由','Curious · Bright · Free'],lines:[['起床啦！今天也有一个值得发现的小世界，出发吧。','Rise and shine! A small world is waiting to be discovered. Let’s go.'],['倒计时十五分钟！带上钥匙，我们去见见今天。','Fifteen minutes to go! Grab your keys. Let’s meet the day.'],['灵感已捕获。下一次冒险，就从这里开始。','Idea captured. Our next adventure starts right here.']]},{name:'Dusk',image:'assets/avatar-dusk.webp',trait:['沉静 · 清晰 · 可靠','Quiet · Clear · Steady'],lines:[['早安。今天先做好最重要的一件事，其他的慢慢来。','Good morning. Begin with the one thing that matters most. The rest can wait.'],['十五分钟后出发。路线已经想好，按自己的节奏来。','We leave in fifteen minutes. Take it at your own pace.'],['已经记录。你可以放下这件事，继续眼前的工作。','Recorded. You can put this down and return to what is in front of you.']]}];
function textPair(p){return p[language==='zh'?0:1]}
function settleAnimation(record){try{if(typeof record.animation?.complete==='function')record.animation.complete();record.animation?.pause?.();}catch{}record.element.style.opacity='1';record.element.style.transform='none';activeAnimations.delete(record);}
function finishAnimations(){[...activeAnimations].forEach(settleAnimation);}
function animateOnce(selector,options){const element=$(selector);if(!element)return;[...activeAnimations].filter(r=>r.element===element).forEach(settleAnimation);if(paused||reduce.matches||readerIndex>=0||!window.anime?.animate){element.style.opacity='1';element.style.transform='none';return}const record={element,animation:null};activeAnimations.add(record);record.animation=window.anime.animate(element,{...options,onComplete:()=>{element.style.opacity='1';element.style.transform='none';activeAnimations.delete(record)}});}
function cancelFlow(){runToken++;if(runTimer!==null){clearTimeout(runTimer);runTimer=null;}if(runResolver){const resolve=runResolver;runResolver=null;resolve();}running=false;}

function rail(items){return `<div class="rail">${items.map((p,i)=>`<div class="rail-node"><span class="pin"></span><h4>${p[0]}</h4><p>${p[1]}</p></div>`).join('')}</div>`}

function render(){cancelFlow();finishAnimations();const y=scrollY;document.documentElement.lang=language==='zh'?'zh-CN':'en';document.title=T('最高 × Team247 — 三种可能 / A','Highest × Team247 — Possible Worlds / A');document.body.classList.toggle('paused',paused);document.body.classList.toggle('motion',!reduce.matches&&!paused);

lass="line"><span class="soft">Lived out there.</span></span>'}</h1><p class="hero-description">${T('三个产品方向，三种与 AI 相处的可能。<br>从熟悉的陪伴，到真正完成的工作，<br>再到一场可以亲自走进去的人生。','Three directions. Three ways to live with AI.<br>A familiar presence. Work that gets done.<br>A life story you can step inside.')}</p><a class="read-link" href="review.html">${T('阅读新版商业提案 V5','Read business review V5 · Chinese')}<span class="arrow">↗</span></a><div class="hero-bottom"><div class="chapter-track">${window.PROPOSALS.map((p,i)=>`<a class="track-link" href="#${p.id}"><b>0${i+1}</b>${T(['喜欢的人物','专业的工作','自己的故事'][i],['A familiar presence','Work, completed','Your story, playable'][i])} ↗</a>`).join('')}</div><span class="scroll-note">SCROLL TO EXPLORE</span></div></div><span class="film-caption">LIVE GENERATIVE LIGHT / THREE EXPLORATIONS</span></section>
<section class="chapter" id="persona"><div class="wrap"><div class="chapter-head reveal"><div class="chapter-index">01</div><div class="chapter-intro"><div class="chapter-tag"><i class="dot"></i>PERSONAL AI / ${T('私人化生活软件','A FAMILIAR PRESENCE')}</div><h2>${T('不是一张头像。<br>是你喜欢的那个身份。','More than an avatar.<br>A presence that matters.')}</h2><p class="chapter-deck">${T('形象、声音、口头禅、性格。让一个熟悉的身份，叫你起床、提醒事情、记下生活。','Appearance, voice, signature phrases, personality. Let a familiar identity wake you, remind you, and capture the day.')}</p>${readBtn(0)}</div></div><div class="persona-layout reveal"><div class="portrait-stage"><img id="portrait" src="${people[persona].image}" alt="${T('原创虚构角色概念图','Original fictional character concept art')}"><div class="portrait-label"><strong id="person-name">${people[persona].name}</strong><span>ORIGINAL CHARACTER</span></div></div><div class="persona-config"><div class="demo-label">${T('可交互概念 · 选择一种相处方式','INTERACTIVE CONCEPT · CHOOSE A PRESENCE')}</div><div class="avatar-selector">${people.map((p,i)=>`<button class="avatar-choice ${persona===i?'active':''}" data-persona="${i}" aria-pressed="${persona===i}"><img src="${p.image}" alt=""><span>${p.name}</span></button>`).join('')}</div><h3 id="person-trait">${textPair(people[persona].trait)}</h3><p>${T('同一件小事，用你喜欢的方式发生。','The same little moment, in a way that feels like you.')}</p><div class="scene-tabs" role="tablist" aria-label="${T('生活场景','Daily moments')}">${[T('叫醒','Wake-up'),T('提醒','Reminder'),T('备忘','A note')].map((s,i)=>`<button role="tab" aria-selected="${scene===i}" class="scene-tab ${scene===i?'active':''}" data-scene="${i}">${s}</button>`).join('')}</div><div class="message" role="tabpanel" aria-live="polite"><div class="message-time" id="message-time">${['07:30 / GOOD MORNING','09:45 / TIME TO GO','21:10 / A LITTLE IDEA'][scene]}</div><div class="message-quote" id="message-quote">${textPair(people[persona].lines[scene])}</div><div class="wave" aria-hidden="true">${'<i></i>'.repeat(27)}</div><div class="message-role">${T('文字演示 · 不播放音频','Text demonstration · No audio playback')}</div></div><p class="concept-note">${T('原创虚构角色，用于演示人设与场景。真人及商业 IP 的使用以相应同意与授权为前提。','Original fictional characters demonstrate identity and context. Real people and commercial IP require appropriate consent and rights.')}</p></div></div><div class="mechanism reveal"><div class="mechanism-head"><span class="micro">${T('从认同，到每天使用','FROM AFFINITY TO EVERYDAY USE')}</span><span class="micro">${T('机制示意 · 尚待验证','CONCEPTUAL MECHANISM · TO BE VALIDATED')}</span></div>${rail([[T('喜欢一个身份','Care about an identity'),T('从具体圈层与角色认同开始。','Begin with a community and an identity people care about.')],[T('定制相处方式','Shape the relationship'),T('形象、声音与人格保持一致。','Keep appearance, voice, and personality consistent.')],[T('参与日常生活','Become part of the day'),T('叫醒、提醒、备忘真正可用。','Make wake-ups, reminders, and notes genuinely useful.')],[T('持续使用与付费','Return and pay'),T('验证留存，而不只看新鲜感。','Test retention—not novelty alone.')]])}</div></div></section>
