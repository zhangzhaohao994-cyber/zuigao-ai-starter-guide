<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Explore three early-stage AI products by HIGHEST through illustrated, interactive product stories."><title>HIGHEST — Product Studies</title><style>*{box-sizing:border-box}html{scroll-behavior:smooth;background:#f6f5f0;color:#191a19;font-family:Arial,'PingFang SC',sans-serif}body{margin:0}a,button{color:inherit}a{text-decoration:none}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid #947131;outline-offset:3px}[hidden]{display:none!important}.wrap{width:min(1240px,90%);margin:auto}header{border-bottom:1px solid #bdbdb5}.nav{height:65px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;letter-spacing:-.06em;font-size:23px}.brand:before{content:'◩';margin-right:8px}.navaside{display:flex;gap:25px;align-items:center}.ey,.navaside,figcaption,.num,.flow,.step{font:600 11px/1.55 ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase}.lang{background:none;border:1px solid #aaa99f;border-radius:99px;padding:6px 12px}.top{padding:45px 0 24px;display:flex;align-items:center;justify-content:space-between}.rule{border-top:1px solid #252723;padding:14px 0}.cover{display:grid;grid-template-columns:1.45fr 1fr;align-items:end;gap:4%;margin:8px 0 37px}h1,h2,h3,p,figure{margin:0}h1,h2,blockquote,.read{font:normal clamp(45px,6.8vw,99px)/1.01 Georgia,'Songti SC',serif;letter-spacing:-.064em;text-wrap:balance}.cover p,.intro,.prose{font-size:clamp(16px,1.38vw,20px);line-height:1.6}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{display:block}.plate,.shot{position:relative;background:#252525;color:white;overflow:hidden}.plate{aspect-ratio:1.18}.plate img,.shot img{width:100%;height:100%;object-fit:cover;filter:grayscale(1);display:block;transition:transform .65s ease}.card:hover img{transform:scale(1.045)}.plate:after,.shot:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#0003,transparent 36%,#0008)}.num{position:absolute;top:16px;left:16px;z-index:1}.plate b{position:absolute;z-index:1;right:12px;bottom:9px;font-size:25px}.card .ey{display:block;padding-top:14px;color:#62635c}.card h3{font:normal clamp(23px,2.5vw,38px)/1.15 Georgia,'Songti SC',serif;letter-spacing:-.045em;margin:6px 0 10px}.card p{line-height:1.55}.foot{margin-top:56px;padding:18px 0 35px;border-top:1px solid #999b92;display:flex;justify-content:space-between;gap:15px}.hero{display:grid;grid-template-columns:1.08fr 1fr;gap:6%;align-items:center;padding-bottom:45px}.hero h1{font-size:clamp(40px,5.6vw,85px);margin:16px 0 20px}.shot{aspect-ratio:1.4}.shot .stamp{position:absolute;bottom:16px;left:18px;z-index:1;font:italic 26px Georgia}.pair{display:grid;grid-template-columns:.85fr 1.15fr;gap:7%;margin:32px 0 54px;align-items:start}h2{font-size:clamp(32px,3.9vw,58px);margin:12px 0 20px}.device{background:#1d1e1c;color:#f8f7ef;padding:clamp(22px,3.5vw,52px);border-radius:3px}.switches{display:flex;flex-wrap:wrap;gap:6px;margin:25px 0}.switches button{background:transparent;color:#eee;border:1px solid #77786f;border-radius:30px;padding:8px 12px}.switches [aria-pressed=true]{background:#f6f5f0;color:#171817}.read{font-size:clamp(35px,4.8vw,70px);margin-bottom:14px}.out{min-height:126px}.out p,.note p,.model p{font-size:16px;line-height:1.65}.flow{border-top:1px solid #77786f;padding-top:16px;color:#d0d0c6}.notes,.model{display:grid;grid-template-columns:1fr 1fr;gap:7%;padding:22px 0 44px}.note h3,.model h3{font-size:20px;margin-bottom:9px}.model{align-items:center}.chart{background:#e9e9e1;padding:20px}.bar{margin-top:10px}.bar label{display:flex;justify-content:space-between;font-size:14px}.track{background:#d4d4ca;height:7px;margin-top:5px}.track i{display:block;height:100%;background:#363732}.closing{background:#20211f;color:#faf9ef;padding:36px clamp(20px,4vw,64px)}blockquote{margin:16px 0;font-size:clamp(31px,4.4vw,66px)}.next{display:inline-block;border-bottom:1px solid;margin:12px 0 0;padding:5px 0}.anim{animation:arrive .38s both}@keyframes arrive{from{opacity:.35;transform:translateY(7px)}to{opacity:1;transform:none}}html:lang(zh-CN) h1,html:lang(zh-CN) h2,html:lang(zh-CN) blockquote{letter-spacing:-.04em;line-height:1.19}@media(max-width:700px){.wrap{width:90%}.top{padding:23px 0 15px}.cover,.hero,.pair,.model,.notes{grid-template-columns:1fr;gap:19px}.cover{margin:8px 0 24px}.cards{grid-template-columns:1fr;gap:23px}.plate{aspect-ratio:2}.card h3{font-size:29px}.hero{padding-bottom:26px}.shot{aspect-ratio:1.85}.pair{margin:20px 0 32px}.navaside{gap:12px}.foot{margin-top:28px}.out{min-height:110px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}</style><header><div class="wrap nav"><a class="brand" href="#home">HIGHEST</a><div class="navaside"><a id="indexlink" href="#home"></a><button class="lang" id="lang"></button></div></div></header><main class="wrap" id="main"></main><noscript>Please enable JavaScript to explore the three interactive product stories. 请开启 JavaScript 浏览项目。</noscript><script>const projects=[{"id": "alarm", "pic": "02-morning.jpg", "name": "Character Alarm|角色闹钟", "tag": "Personal AI|个人 AI", "hook": "Who wakes you at seven?|明早七点，你想被谁叫醒？", "intro": "Before you reach for snooze, you hear two familiar barks. A character alarm turns someone you recognize into the face and voice of the tools you use all day.|手还没摸到贪睡键，你先听见了熟悉的两声狗叫。角色闹钟想让每天叫你起床的那个角色，也陪你记事、算账和计时。", "alt": "Morning light falling on a bedside table|清晨的光照在床头柜上", "flow": "Choose a character › Set an alarm › Keep it for another task|选角色 › 设闹钟 › 再用一个工具", "controls": "Wake up;Split lunch;Make tea|起床;分午餐账单;泡茶", "readouts": "07:00;126 ÷ 3 = 42;03:00|07:00;126 ÷ 3 = 42;03:00", "replies": "Two barks. One crooked ear. Good morning.;“My share? Zero.” Your lunch split is ready.;Three minutes. Your character keeps time.|两声狗叫，一只耷拉的耳朵。早安。;“我的那份？零。”三个人，每人 42 元。;三分钟。你泡茶，让它看时间。", "scene": "One face, three small jobs.|同一个角色，三件日常小事。", "body": "Start with a pet owner who already keeps a favorite photo. In the proposed app, a photo becomes a stylized avatar; an authorized voice can become its greeting. Once awake, the owner taps a tool and gets an answer in character, without composing a chat prompt.|先从手机里存着宠物照片的人开始。设想中的 App 会把照片做成角色，也可以用获得授权的声音打招呼。起床之后，点一下工具就能得到带有角色个性的回应，不用在聊天框里想怎么提问。", "today": "The browser prototype saves a persona, a catchphrase and a note, and plays a test alert while open using system speech.|浏览器原型能保存角色设定、口头禅和笔记；页面打开时，可以用系统语音试听提醒。", "gate": "Photo avatars, voice cloning and locked-screen alarms are planned. Before charging, the native pilot targets 100 on-time alarms in 100 device tests; then compare three-morning reuse with a plain alarm.|照片建模、声音克隆和锁屏闹钟仍在规划。收费前，原生试点要通过 100 次设备准点测试，再比较角色闹钟与普通闹钟连续三个早晨的留存。", "price": "Proposed: ¥1/month for tools; ¥19.9 per original pack, ¥59 per authorized voice and ¥99 per photo avatar.|拟定价：工具每月 1 元；原创角色包 19.9 元、授权声音 59 元、照片角色 99 元。", "chart": "Illustrative price menu · RMB|拟定价目 · 元", "labels": "Character pack;Voice profile;Photo avatar|角色包;声音档案;照片角色", "vals": [19.9, 59, 99], "assume": "A proposed mainland China launch precedes an English-language pilot. Repeat use across alarms, notes and timers matters more than a first listen.|计划先在中国内地试点，再测试英文版。比起第一次试听，更关键的是用户是否继续用它设闹钟、记事或计时。", "end": "The first alarm earns attention. The second morning tests whether it belongs there.|第一次叫醒让人注意。第二天还愿意设它，才说明它有位置。", "img": "https://zhangzhaohao994-cyber.github.io/zuigao-ai-starter-guide/team247-memo/images/02-morning.jpg"}, {"id": "story", "pic": "06-storygame.jpg", "name": "Personal Story Game|个人故事定制游戏", "tag": "Interactive fiction|互动叙事", "hook": "She puts down her keys. What do you say?|她把钥匙放在桌上。你要说什么？", "intro": "A photograph keeps the room. A message keeps the words. This game puts you back in the moment when you could have answered differently.|照片留住了房间，聊天记录留住了原话。这个游戏想把你放回当时，让你亲手选一次不同的回答。", "alt": "A model room filled with branching narrative paths|微缩房间里延伸出的故事路径", "flow": "Bring a memory › Approve the scene › Play three endings|带来一段回忆 › 确认场景 › 玩出三个结局", "controls": "Let her go;Offer a chair;Speak up|让她走;拉一把椅子;说出真心话", "readouts": "Route 01;Route 02;Route 03|路线 01;路线 02;路线 03", "replies": "The door closes. Play the goodbye as remembered.;She sits down. Another season together, then a gentler goodbye.;This time you say it. The two characters try again.|门合上了。重走记忆中的那次分别。;她坐下来。你们多走过一个季节，然后好好道别。;这次你说出口了。故事里的两个人决定再试一次。", "scene": "One memory. Three playable endings.|同一段往事，三个能玩的结局。", "body": "An adult player brings an authorized exchange or a written memory. In the planned app they check the timeline, approve two portraits and recognize their room in the opening scene. One route follows the memory; two are explicitly fictional. The three-minute opening lets a player make a choice before seeing a price.|成年玩家带来获准使用的聊天片段，或自己写下的一段回忆。在规划中的 App 里，玩家核对时间线、确认两位主角，然后在开场画面里认出自己的客厅。一条路线还原回忆，另两条明确是虚构。前三分钟免费，做完第一次选择才看到价格。", "today": "A browser prototype places names and personal text into five preset scenes with three endings. Generated portraits, rooms, scripts and mobile checkout are planned.|浏览器原型能把姓名和文字放进五个预设场景，走向三个结局。生成肖像、房间、剧本和移动端支付仍在规划。", "gate": "Start with five creators, a Chinese romance chapter and a separate US English pilot. Expand only after two groups of 1,000 starters each reach 10% paid conversion and refunds stay at or below 3%. Use fictional faces when permission is missing.|先找五位创作者，试做中文情感章节，并在美国单独测试英文版。两组各 1,000 名开玩者都达到 10% 付费、退款率不超过 3%，才扩大投放。没有肖像授权就用虚构形象。", "price": "Proposed: ¥99 unlocks three endings. ¥599 includes a custom subplot, character or epilogue; an existing buyer pays only the ¥500 difference.|拟定价：99 元解锁三个结局；599 元可定制支线、角色或尾声。已购用户只补 500 元差价。", "chart": "Pilot funnel · targets per 100 starters|试点漏斗 · 每百名开玩者的目标", "labels": "Start;Finish the chapter;Buy|开玩;完成章节;购买", "vals": [100, 50, 10], "assume": "A full ending gives players a reason to pay; reusable rooms and branching scripts keep each new story affordable to produce.|完整结局提供付费理由。房间和分支结构可以复用，让每个新故事都不必从零制作。", "end": "The test is whether a player who knows the real ending will pay to try another.|玩家已经知道真实结局，还愿不愿意付费再选一次？", "img": "https://zhangzhaohao994-cyber.github.io/zuigao-ai-starter-guide/team247-memo/images/06-storygame.jpg"}, {"id": "industry", "pic": "05-clinic.jpg", "name": "Industry Agents|垂直行业定制智能体", "tag": "Business software|企业软件", "hook": "“Can I come on Saturday?”|“我周六能过来吗？”", "intro": "A post brought in a customer. The editor knows which post; the front desk knows the schedule. An industry agent is designed to keep the question, its source and the next action together.|一篇推文带来一位顾客。编辑知道顾客看了什么，前台知道周六几点有空。行业智能体想让这条咨询、它的来源和下一步跟进始终放在一起。", "alt": "Reception desk in a clinic, the setting for the example inquiry|示例咨询发生的门店前台", "flow": "Approved brief › Draft and review › Track the inquiry|审核过的资料 › 拟稿与复核 › 跟进咨询", "controls": "Draft;Attribute;Hand off|拟稿;标记来源;转人工", "readouts": "01 / Draft;02 / Lead;03 / Handoff|01 / 草稿;02 / 线索;03 / 转交", "replies": "The editor reviews a Saturday opening-hours post against the shop’s approved brief.;A reader asks for a visit. The inquiry stays attached to the post that prompted it.;The front desk takes the booking request. A medical question goes to a qualified professional.|编辑根据门店确认过的资料，复核周六营业时间的推文草稿。;读者咨询预约。线索卡保留了引发咨询的那篇推文。;前台接手预约请求；涉及医疗判断的问题交给专业人员。", "scene": "Follow one inquiry from post to front desk.|跟着一条咨询，从推文走到前台。", "body": "The first buyer is an owner whose team publishes and answers inquiries every week. A clinic supplies approved service details. A design studio might supply floor plans, budgets and site-visit slots instead. The review rules change by trade; scheduling, attribution and handoff can be reused.|第一批买家是每周都要发内容、接咨询的门店老板。诊所提供审核过的服务资料；换成设计工作室，输入就变成户型、预算和量房时段。各行业的审核规则不同，排期、来源标记和转交机制可以复用。", "today": "The browser prototype supports selecting a trade, editing a template and moving a sample lead. Model-generated content, metering, connected accounts and billing are planned.|浏览器原型支持选择行业、编辑模板草稿、推进示例线索。模型生成、用量计量、账号连接和支付仍待开发。", "gate": "Interview five beauty operators and five design studios. Offer 20 merchants the same paid brief: the first gate is five purchases and four drafts used. Test renewals and top-ups against actual invoices before expanding.|先访谈五位美业经营者和五家设计工作室。向 20 位商户报同一个价，第一关是五家付款、四家实际采用草稿。扩大前，用真实账单检验续用和充值需求。", "price": "Proposed: ¥199 for a starter content task; ¥2,000/year for account operations, leads and a credit allowance. Teams pay separately for production beyond the allowance.|拟定价：199 元试做内容任务；年费 2,000 元，加上账号运营、线索管理和基础额度。超出额度的制作另行购买。", "chart": "Starter pilot · target merchants|入门试点 · 目标商户数", "labels": "Receive a quote;Buy a task;Use the draft|收到报价;付费试做;采用草稿", "vals": [20, 5, 4], "assume": "The annual plan depends on useful work recurring every month. Compare published drafts, reply times and paid refills across merchants.|年费成立的前提，是每个月都有值得交给它的工作。试点将比较商户实际采用的草稿、回复速度和追加购买记录。", "end": "The useful unit is a customer inquiry someone follows up, not another draft in a folder.|价值落在有人接手的那条咨询上，而不止是文件夹里多了一份草稿。", "img": "https://zhangzhaohao994-cyber.github.io/zuigao-ai-starter-guide/team247-memo/images/05-clinic.jpg"}];</script><script>
let zh=new URLSearchParams(location.search).get('lang')==='zh',stage=0;
const t=s=>s.split('|')[+zh], E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), f=s=>E(t(s)), ey=s=>'<div class="ey">'+f(s)+'</div>', num=i=>'0'+(i+1), plate=(p,i,hero=false)=>'<div class="'+(hero?'shot':'plate')+'"><img alt="'+f(p.alt)+'" src="'+p.img+'"><span class="num">FIG. '+num(i)+'</span>'+(hero?'<span class="stamp">'+f(p.name)+'</span>':'<b aria-hidden="true">↗</b>')+'</div>';
const frame=(i,top)=>'<div class="top"><span class="ey">'+f(top)+'</span><span class="ey">'+i+' / 03</span></div>';
function render(focus=false){let i=projects.findIndex(p=>p.id===location.hash.slice(1)),p=projects[i];document.documentElement.lang=zh?'zh-CN':'en';document.title=(p?t(p.name):t('Product Studies|产品研究'))+' · '+t('HIGHEST|最高');lang.textContent=zh?'English':'中文';indexlink.textContent=t('Project index|项目目录');document.querySelector('.brand').textContent=t('HIGHEST|最高');main.innerHTML='<div class="anim">'+(i<0?frame('00','Product studies · November 2026|产品研究 · 2026 年 11 月')+'<div class="cover"><h1>'+f('Three ways to put AI to work.|AI 可以从这三件事开始。')+'</h1><p>'+f('Choose who wakes you. Replay a goodbye. Trace a booking back to a post. Three early product studies by HIGHEST, each built around a moment you can try for yourself.|选一个叫你起床的角色，重玩一次告别，或是找到带来预约的那条推文。最高的三个早期产品研究，都从一个你能亲手试试的场景开始。')+'</p></div><div class="rule ey">'+f('Explore the projects ↓|选择一个项目 ↓')+'</div><div class="cards">'+projects.map((p,i)=>'<a class="card" href="#'+p.id+'">'+plate(p,i)+'<span class="ey">'+f(p.tag)+'</span><h3>'+f(p.name)+'</h3><p>'+f(p.hook)+'</p></a>').join('')+'</div>':
frame(num(i),p.tag)+'<div class="hero"><div>'+ey(p.name)+'<h1>'+f(p.hook)+'</h1><p class="intro">'+f(p.intro)+'</p></div>'+plate(p,i,true)+'</div><div class="rule ey">'+f('01 / Inside the product|01 / 产品怎么用')+'</div><div class="pair"><div><h2>'+f(p.scene)+'</h2><p class="prose">'+f(p.body)+'</p></div><section class="device">'+ey('Interactive storyboard · Choose a step|互动分镜 · 点选体验')+'<div class="switches">'+t(p.controls).split(';').map((s,j)=>'<button data-step="'+j+'">'+E(s)+'</button>').join('')+'</div><div class="out" aria-live="polite"></div><div class="flow">'+f(p.flow)+'</div></section></div><div class="rule ey">'+f('02 / From prototype to pilot|02 / 从原型到试点')+'</div><div class="notes">'+[['Working prototype|现有原型',p.today],['Next proof point|下一项验证',p.gate]].map(([k,v])=>'<div class="note"><h3>'+f(k)+'</h3><p>'+f(v)+'</p></div>').join('')+'</div><div class="rule ey">'+f('03 / Business model · Forecast, not results|03 / 商业模式 · 以下为预测')+'</div><div class="model"><div><h3>'+f('What a buyer pays for|用户为什么付费')+'</h3><p>'+f(p.price)+'</p><br><p>'+f(p.assume)+'</p></div><figure class="chart"><figcaption>'+f(p.chart)+'</figcaption>'+p.vals.map((v,j)=>'<div class="bar"><label>'+E(t(p.labels).split(';')[j])+'<strong>'+v.toLocaleString(zh?'zh-CN':'en-US')+'</strong></label><div class="track"><i style="width:'+v/Math.max(...p.vals)*100+'%"></i></div></div>').join('')+'</figure></div><div class="closing">'+ey('Investment question|投资判断')+'<blockquote>'+f(p.end)+'</blockquote><a class="next" href="#'+(projects[i+1]?.id||'home')+'">'+(i<2?f('Next project|下一个项目')+' · '+f(projects[i+1].name):f('Back to the project index|返回项目目录'))+' →</a></div>')+'<footer class="foot ey"><span>'+f('HIGHEST / Product studies|最高 / 产品研究')+'</span><span>2026.11</span></footer></div>';
if(p){const draw=()=>{main.querySelectorAll('[data-step]').forEach((b,j)=>{b.setAttribute('aria-pressed',j===stage);b.onclick=()=>{stage=j;draw()}});main.querySelector('.out').innerHTML='<div class="anim"><div class="read">'+E(t(p.readouts).split(';')[stage])+'</div><p>'+E(t(p.replies).split(';')[stage])+'</p></div>'};draw()}if(focus){main.tabIndex=-1;main.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}}
lang.onclick=()=>{zh=!zh;let u=new URL(location.href);if(zh)u.searchParams.set('lang','zh');else u.searchParams.delete('lang');history.replaceState(null,'',u);render()};onhashchange=()=>{stage=0;render(true)};render();
</script></html>
